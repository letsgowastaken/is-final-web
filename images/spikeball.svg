<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#1a1a1a"/>
  <!-- grass -->
  <rect y="330" width="640" height="90" fill="#2e5d34"/>
  <!-- net rim (ellipse for perspective) -->
  <ellipse cx="320" cy="300" rx="220" ry="60" fill="none" stroke="#ffd100" stroke-width="14"/>
  <!-- legs -->
  <g stroke="#ffd100" stroke-width="10" stroke-linecap="round">
    <line x1="120" y1="308" x2="100" y2="360"/>
    <line x1="520" y1="308" x2="540" y2="360"/>
    <line x1="230" y1="352" x2="225" y2="395"/>
    <line x1="410" y1="352" x2="415" y2="395"/>
  </g>
  <!-- net mesh -->
  <g stroke="#888" stroke-width="2" opacity="0.9">
    <ellipse cx="320" cy="300" rx="180" ry="48" fill="none"/>
    <ellipse cx="320" cy="300" rx="135" ry="36" fill="none"/>
    <ellipse cx="320" cy="300" rx="90" ry="24" fill="none"/>
    <ellipse cx="320" cy="300" rx="45" ry="12" fill="none"/>
    <line x1="100" y1="300" x2="540" y2="300"/>
    <line x1="170" y1="262" x2="470" y2="338"/>
    <line x1="470" y1="262" x2="170" y2="338"/>
    <line x1="320" y1="240" x2="320" y2="360"/>
  </g>
  <!-- ball mid-air -->
  <circle cx="430" cy="110" r="34" fill="#ffd100"/>
  <path d="M396 110 a34 34 0 0 0 68 0" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M404 92 a40 26 0 0 1 52 0" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- motion lines -->
  <g stroke="#ffd100" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="360" y1="160" x2="390" y2="135"/>
    <line x1="350" y1="190" x2="385" y2="160"/>
  </g>
  <text x="320" y="50" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ffd100" font-weight="900">ROUNDNET</text>
</svg>
