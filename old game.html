<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polygon Royale</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;}
  #c{display:block;width:100vw;height:100vh;cursor:crosshair;}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,16,28,.82);color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;}
  #overlay h1{font-size:54px;margin:0 0 6px;letter-spacing:2px;}
  #overlay h1 span{color:#ffd23f;}
  #overlay p{color:#aebdd2;margin:6px 0;}
  #overlay .keys{display:inline-block;text-align:left;margin:14px 0;color:#cfe0f5;line-height:1.8;}
  #overlay button{font-size:22px;font-weight:bold;padding:12px 36px;border:none;border-radius:10px;
    background:#ffd23f;color:#22293a;cursor:pointer;margin-top:10px;}
  #overlay button:hover{background:#ffe27a;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <div id="panel">
    <h1>POLYGON <span>ROYALE</span></h1>
    <p id="subtitle">You vs 7 bots. Last one standing wins.</p>
    <div class="keys">
      WASD — move &nbsp;·&nbsp; Mouse — look &nbsp;·&nbsp; Left click — attack / use<br>
      Space — jump &nbsp;·&nbsp; Shift — sprint &nbsp;·&nbsp; E — open chest<br>
      1–5 — inventory slots &nbsp;·&nbsp; R — reload &nbsp;·&nbsp; Esc — release mouse
    </div><br>
    <button id="playBtn">DROP IN</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   POLYGON ROYALE v2 — single-file third-person battle royale.
   Procedural island, painter's-algorithm 3D on a 2D canvas.
   No external assets or libraries.
   ===================================================================== */

// ---------------------------------------------------------------------
// Canvas
// ---------------------------------------------------------------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=0,H=0;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener("resize",resize); resize();

// ---------------------------------------------------------------------
// Math / random
// ---------------------------------------------------------------------
const TAU=Math.PI*2;
const clamp=(v,a,b)=> v<a?a:v>b?b:v;
const lerp=(a,b,t)=> a+(b-a)*t;
const dist2d=(ax,az,bx,bz)=> Math.hypot(ax-bx,az-bz);
let seed=1337;
function rng(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
function hash2(ix,iz){ let h=ix*374761393+iz*668265263; h=(h^(h>>13))*1274126177;
  return ((h^(h>>16))>>>0)/4294967296; }
const smoothT=t=>t*t*(3-2*t);
function noise2(x,z){
  const ix=Math.floor(x),iz=Math.floor(z),fx=smoothT(x-ix),fz=smoothT(z-iz);
  return lerp(lerp(hash2(ix,iz),hash2(ix+1,iz),fx),
              lerp(hash2(ix,iz+1),hash2(ix+1,iz+1),fx),fz);
}
const fbm=(x,z)=> noise2(x,z)*0.6+noise2(x*2.1,z*2.1)*0.28+noise2(x*4.6,z*4.6)*0.12;

// ---------------------------------------------------------------------
// World constants
// ---------------------------------------------------------------------
const CELL=10, N=80, HALF=N*CELL/2;     // 800x800 world
const WATER_Y=0.35, VIEW_DIST=250, GRAV=22;

// ---------------------------------------------------------------------
// Terrain
// ---------------------------------------------------------------------
const heights=new Float32Array((N+1)*(N+1));
const cellRoad=new Uint8Array(N*N);
const hIndex=(i,j)=> j*(N+1)+i;
function baseHeight(x,z){
  const d=Math.hypot(x,z)/335;
  let h=fbm(x*0.011+9.7,z*0.011+3.1)*30-2.5;        // rolling hills
  h+=noise2(x*0.05,z*0.05)*2;                        // small bumps
  h*=clamp(1.22-d*d,0,1);
  h-=Math.max(0,d-1)*40;
  return h;
}
function genTerrain(){
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++)
    heights[hIndex(i,j)]=baseHeight(i*CELL-HALF,j*CELL-HALF);
  const RW=9;
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
    const x=i*CELL-HALF,z=j*CELL-HALF;
    if(Math.abs(z)<=RW&&Math.abs(x)<=310)
      heights[hIndex(i,j)]=lerp(heights[hIndex(i,j)],Math.max(baseHeight(x,0),WATER_Y+1.6),0.9);
    if(Math.abs(x)<=RW&&Math.abs(z)<=310)
      heights[hIndex(i,j)]=lerp(heights[hIndex(i,j)],Math.max(baseHeight(0,z),WATER_Y+1.6),0.9);
  }
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=i*CELL-HALF+CELL/2,z=j*CELL-HALF+CELL/2;
    cellRoad[j*N+i]=((Math.abs(z)<6.5&&Math.abs(x)<=305)||(Math.abs(x)<6.5&&Math.abs(z)<=305))?1:0;
  }
}
function heightAt(x,z){
  const gx=clamp((x+HALF)/CELL,0,N-0.001),gz=clamp((z+HALF)/CELL,0,N-0.001);
  const i=Math.floor(gx),j=Math.floor(gz),fx=gx-i,fz=gz-j;
  return lerp(lerp(heights[hIndex(i,j)],heights[hIndex(i+1,j)],fx),
              lerp(heights[hIndex(i,j+1)],heights[hIndex(i+1,j+1)],fx),fz);
}
function flattenPad(cx,cz,r){
  const h0=Math.max(heightAt(cx,cz),WATER_Y+1.6);
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
    const x=i*CELL-HALF,z=j*CELL-HALF;
    const d=Math.max(Math.abs(x-cx),Math.abs(z-cz));
    if(d<r) heights[hIndex(i,j)]=h0;
    else if(d<r+CELL) heights[hIndex(i,j)]=lerp(h0,heights[hIndex(i,j)],(d-r)/CELL);
  }
  return h0;
}

// ---------------------------------------------------------------------
// Items & weapons (Fortnite-style loot pool)
// ---------------------------------------------------------------------
const RARITY=[
  {name:"Common",col:"#b8bfc7",mult:1.00},
  {name:"Rare",col:"#3aa0ff",mult:1.15},
  {name:"Epic",col:"#c05df5",mult:1.30},
  {name:"Legendary",col:"#ff9a2e",mult:1.50},
];
const WEAPONS={
  pickaxe:{label:"Pickaxe",short:"PICK",type:"melee",dmg:20,rate:1.7,range:3.6},
  pistol :{label:"Pistol",short:"PSTL",type:"gun",dmg:26,rate:3.4,mag:12,reload:1.3,speed:280,spread:0.013,pellets:1},
  smg    :{label:"SMG",short:"SMG",type:"gun",dmg:13,rate:11,mag:25,reload:1.6,speed:280,spread:0.038,pellets:1},
  ar     :{label:"Assault Rifle",short:"AR",type:"gun",dmg:18,rate:7.5,mag:30,reload:2.0,speed:320,spread:0.024,pellets:1},
  shotgun:{label:"Shotgun",short:"SHTG",type:"gun",dmg:9,rate:1.1,mag:5,reload:2.2,speed:240,spread:0.085,pellets:8},
  sniper :{label:"Sniper Rifle",short:"SNPR",type:"gun",dmg:85,rate:0.65,mag:3,reload:2.6,speed:520,spread:0.002,pellets:1},
  potion :{label:"Shield Potion",short:"POT",type:"heal",drink:1.6,shield:50},
  medkit :{label:"Medkit",short:"MED",type:"heal",drink:3.0,hp:100},
};
function makeItem(key,rarity){
  const def=WEAPONS[key];
  return {key,def,rarity,ammo:def.mag||0,reloading:0,cooldown:0,drinking:0};
}
function rollLoot(){
  const r=rng();
  let key = r<0.16?"pistol" : r<0.34?"smg" : r<0.54?"ar" : r<0.70?"shotgun"
          : r<0.78?"sniper" : r<0.91?"potion" : "medkit";
  const rr=rng();
  const rarity = key==="sniper" ? (rr<0.5?2:3)
               : (rr<0.45?0 : rr<0.75?1 : rr<0.93?2 : 3);
  return makeItem(key, WEAPONS[key].type==="heal"?1:rarity);
}
const itemDPS=it=> it.def.type!=="gun" ? (it.def.type==="melee"?25:0)
  : it.def.dmg*(it.def.pellets||1)*it.def.rate*RARITY[it.rarity].mult;

// ---------------------------------------------------------------------
// Buildings & chests
// ---------------------------------------------------------------------
class Building{
  constructor(cx,cz,doorSide){
    this.cx=cx;this.cz=cz;this.s=6.5;this.h=7;
    this.y=flattenPad(cx,cz,12);
    this.walls=[];this.doorSide=doorSide;
    const s=this.s,D=1.9;
    const sides=[
      {a:[cx-s,cz-s],b:[cx+s,cz-s],id:0},{a:[cx+s,cz-s],b:[cx+s,cz+s],id:1},
      {a:[cx+s,cz+s],b:[cx-s,cz+s],id:2},{a:[cx-s,cz+s],b:[cx-s,cz-s],id:3}];
    for(const sd of sides){
      if(sd.id===doorSide){
        const mx=(sd.a[0]+sd.b[0])/2,mz=(sd.a[1]+sd.b[1])/2;
        const dx=(sd.b[0]-sd.a[0])/(2*s),dz=(sd.b[1]-sd.a[1])/(2*s);
        this.walls.push({x1:sd.a[0],z1:sd.a[1],x2:mx-dx*D,z2:mz-dz*D});
        this.walls.push({x1:mx+dx*D,z1:mz+dz*D,x2:sd.b[0],z2:sd.b[1]});
      } else this.walls.push({x1:sd.a[0],z1:sd.a[1],x2:sd.b[0],z2:sd.b[1],win:true});
    }
  }
}
class Chest{ constructor(x,z){ this.x=x;this.z=z;this.y=heightAt(x,z);this.open=false;this.anim=0; } }
class Pickup{ constructor(x,z,item){ this.x=x;this.z=z;this.y=heightAt(x,z)+0.7;this.item=item;this.t=0; } }

// ---------------------------------------------------------------------
// Particles
// ---------------------------------------------------------------------
class Particles{
  constructor(){ this.list=[]; }
  burst(x,y,z,col,n,spd){
    for(let i=0;i<n;i++){
      const a=rng()*TAU,b=rng()*Math.PI;
      this.list.push({x,y,z,vx:Math.cos(a)*Math.sin(b)*spd*(0.4+rng()),
        vy:Math.cos(b)*spd*(0.4+rng())+2,vz:Math.sin(a)*Math.sin(b)*spd*(0.4+rng()),
        t:0.7+rng()*0.4,col,size:0.16+rng()*0.2});
    }
  }
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=GRAV*0.6*dt;p.t-=dt;
      if(p.t<=0)this.list.splice(i,1);
    }
  }
}

// ---------------------------------------------------------------------
// Actors
// ---------------------------------------------------------------------
class Actor{
  constructor(game,x,z,name,shirt,pants,skin){
    this.g=game;this.x=x;this.z=z;this.y=heightAt(x,z);
    this.vy=0;this.yaw=rng()*TAU;this.pitch=0;
    this.hp=100;this.shield=0;this.alive=true;this.onGround=true;
    this.name=name;this.shirt=shirt;this.pants=pants;this.skin=skin;
    this.radius=0.55;this.item=makeItem("pickaxe",0);
    this.swing=0;this.walk=0;this.recoil=0;
  }
  eyeY(){ return this.y+1.55; }
  takeDamage(d,from){
    if(!this.alive)return;
    const s=Math.min(this.shield,d);this.shield-=s;d-=s;
    this.hp-=d;this.lastAttacker=from;
    if(from&&this instanceof Bot){ this.alert=8; this.alertTo=from; } // bots fight back
    if(this.hp<=0){
      this.hp=0;this.alive=false;
      this.g.particles.burst(this.x,this.y+1.2,this.z,"#ff5d5d",28,7);
      this.g.feed.push({txt:(from?from.name:"The island")+" eliminated "+this.name,t:5});
      this.g.checkEnd();
    }
  }
  move(dx,dz,dt){
    let nx=this.x+dx,nz=this.z+dz;
    const r=Math.hypot(nx,nz); if(r>370){nx*=370/r;nz*=370/r;}
    for(const o of this.g.obstacles){
      if(!o.r)continue;
      const d=dist2d(nx,nz,o.x,o.z),min=o.r+this.radius;
      if(d<min&&d>0.001){const p=(min-d)/d;nx+=(nx-o.x)*p;nz+=(nz-o.z)*p;}
    }
    for(const b of this.g.buildings){
      if(Math.abs(nx-b.cx)>b.s+2||Math.abs(nz-b.cz)>b.s+2)continue;
      if(this.y>b.y+b.h-0.5)continue;
      for(const w of b.walls){
        const wx=w.x2-w.x1,wz=w.z2-w.z1,len2=wx*wx+wz*wz;
        let t=((nx-w.x1)*wx+(nz-w.z1)*wz)/len2;t=clamp(t,0,1);
        const px=w.x1+wx*t,pz=w.z1+wz*t,d=dist2d(nx,nz,px,pz),min=this.radius+0.25;
        if(d<min&&d>0.001){const p=(min-d)/d;nx+=(nx-px)*p;nz+=(nz-pz)*p;}
      }
    }
    const moved=Math.hypot(nx-this.x,nz-this.z);
    this.walk+= moved>0.001 ? moved*1.6 : 0;
    this.moving=moved>0.001;
    this.x=nx;this.z=nz;
    this.vy-=GRAV*dt;this.y+=this.vy*dt;
    const g=Math.max(heightAt(this.x,this.z),WATER_Y);
    if(this.y<=g){this.y=g;this.vy=0;this.onGround=true;}else this.onGround=false;
  }
  fire(aYaw,aPitch){
    const it=this.item,def=it.def;
    if(it.cooldown>0||it.reloading>0||it.drinking>0||!this.alive)return;
    if(def.type==="melee"){
      it.cooldown=1/def.rate;this.swing=0.3;
      for(const a of this.g.actors){
        if(a===this||!a.alive)continue;
        const d=dist2d(this.x,this.z,a.x,a.z);
        if(d<def.range){
          const ang=Math.atan2(a.x-this.x,a.z-this.z);
          const diff=Math.atan2(Math.sin(ang-aYaw),Math.cos(ang-aYaw));
          if(Math.abs(diff)<0.85){
            const dmg=Math.round(def.dmg*RARITY[it.rarity].mult);
            a.takeDamage(dmg,this);
            this.g.dmgNums.push({x:a.x,y:a.y+2.0,z:a.z,txt:dmg,t:0.9,col:"#ffd23f"});
            this.g.particles.burst(a.x,a.y+1.2,a.z,"#ffd23f",8,5);
          }
        }
      }
      return;
    }
    if(def.type==="heal"){
      if(def.shield&&this.shield>=100)return;
      if(def.hp&&this.hp>=100)return;
      it.drinking=def.drink;return;
    }
    if(it.ammo<=0){it.reloading=def.reload;return;}
    it.ammo--;it.cooldown=1/def.rate;this.recoil=0.1;this.swing=0.12;
    const mult=RARITY[it.rarity].mult;
    for(let p=0;p<(def.pellets||1);p++){
      const sy=aYaw+(rng()-0.5)*2*def.spread;
      const sp=aPitch+(rng()-0.5)*2*def.spread;
      const cp=Math.cos(sp);
      this.g.projectiles.push({
        x:this.x+Math.sin(this.yaw)*0.7,y:this.eyeY()-0.15,z:this.z+Math.cos(this.yaw)*0.7,
        vx:Math.sin(sy)*cp*def.speed,vy:Math.sin(sp)*def.speed,vz:Math.cos(sy)*cp*def.speed,
        dmg:Math.round(def.dmg*mult),owner:this,life:1.6,col:RARITY[it.rarity].col});
    }
  }
  tickItem(dt){
    const it=this.item;
    if(it.cooldown>0)it.cooldown-=dt;
    if(it.reloading>0){it.reloading-=dt;if(it.reloading<=0){it.reloading=0;it.ammo=it.def.mag;}}
    if(it.drinking>0){it.drinking-=dt;
      if(it.drinking<=0){it.drinking=0;
        if(it.def.shield)this.shield=Math.min(100,this.shield+it.def.shield);
        if(it.def.hp)this.hp=Math.min(100,Math.max(this.hp,it.def.hp));
        this.consumeHeal();}}
    if(this.swing>0)this.swing-=dt;
    if(this.recoil>0)this.recoil-=dt*0.6;
  }
  consumeHeal(){ this.item=makeItem("pickaxe",0); }
}

// ---------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------
class Player extends Actor{
  constructor(game,x,z){
    super(game,x,z,"You","#3aa0ff","#26406b","#f0c49a");
    this.inv=[makeItem("pickaxe",0),null,null,null,null];
    this.slot=0;this.item=this.inv[0];this.yaw=Math.atan2(30,30);
  }
  consumeHeal(){ this.inv[this.slot]=null;this.selectSlot(0); }
  selectSlot(i){ if(!this.inv[i])return; this.slot=i;this.item=this.inv[i]; }
  give(item){
    for(let i=0;i<5;i++)if(!this.inv[i]){
      this.inv[i]=item;
      this.g.toast(RARITY[item.rarity].name+" "+item.def.label+" — slot "+(i+1));
      return true;
    }
    this.g.toast("Inventory full");return false;
  }
  update(dt,input){
    if(!this.alive)return;
    this.tickItem(dt);
    this.yaw+=input.mx*0.0024;input.mx=0;
    this.pitch=clamp(this.pitch-input.my*0.0024,-1.1,0.9);input.my=0;
    const sp=(input.keys["shift"]?10:6.5)*(this.item.drinking>0?0.5:1);
    let fx=0,fz=0;
    if(input.keys["w"]){fx+=Math.sin(this.yaw);fz+=Math.cos(this.yaw);}
    if(input.keys["s"]){fx-=Math.sin(this.yaw);fz-=Math.cos(this.yaw);}
    if(input.keys["a"]){fx-=Math.cos(this.yaw);fz+=Math.sin(this.yaw);}
    if(input.keys["d"]){fx+=Math.cos(this.yaw);fz-=Math.sin(this.yaw);}
    const l=Math.hypot(fx,fz)||1;
    this.move(fx/l*sp*dt,fz/l*sp*dt,dt);
    if(input.keys[" "]&&this.onGround){this.vy=8.4;this.onGround=false;}
    if(input.mouse)this.fire(this.yaw,this.pitch);
    if(input.keys["r"]&&this.item.def.type==="gun"&&this.item.ammo<this.item.def.mag&&!this.item.reloading)
      this.item.reloading=this.item.def.reload;
    if(input.pressedE){
      input.pressedE=false;
      for(const c of this.g.chests)
        if(!c.open&&dist2d(this.x,this.z,c.x,c.z)<3.6){this.g.openChest(c);break;}
    }
    for(let i=this.g.pickups.length-1;i>=0;i--){
      const p=this.g.pickups[i];
      if(dist2d(this.x,this.z,p.x,p.z)<2.3&&Math.abs(this.y-p.y)<3)
        if(this.give(p.item))this.g.pickups.splice(i,1);
    }
  }
}

// ---------------------------------------------------------------------
// Bot AI — roams, loots, hunts the player, fights back, uses cover
// ---------------------------------------------------------------------
class Bot extends Actor{
  constructor(game,x,z,name,shirt,pants,skin){
    super(game,x,z,name,shirt,pants,skin);
    this.state="roam";this.wp=null;this.stateT=0;
    this.shootErr=0.05+rng()*0.05;this.alert=0;
    this.huntT=10+rng()*20;                  // starts hunting the player after a delay
  }
  pickWaypoint(target){
    // waypoints biased toward the player so bots actively come after you
    const P=this.g.player;
    for(let t=0;t<10;t++){
      let x,z;
      if(target||rng()<0.6){
        const tgt=target||P;
        x=tgt.x+(rng()-0.5)*50; z=tgt.z+(rng()-0.5)*50;
      } else {
        const a=rng()*TAU,d=30+rng()*80;
        x=this.x+Math.sin(a)*d; z=this.z+Math.cos(a)*d;
      }
      x=clamp(x,-330,330);z=clamp(z,-330,330);
      if(heightAt(x,z)>WATER_Y+0.5){this.wp={x,z};return;}
    }
    this.wp={x:0,z:0};
  }
  nearestEnemy(){
    let best=null,bd=1e9;
    for(const a of this.g.actors){
      if(a===this||!a.alive)continue;
      const d=dist2d(this.x,this.z,a.x,a.z);
      if(d<bd){bd=d;best=a;}
    }
    return {e:best,d:bd};
  }
  update(dt){
    if(!this.alive)return;
    this.tickItem(dt);
    this.stateT-=dt;this.huntT-=dt;
    if(this.alert>0)this.alert-=dt;
    let {e,d}=this.nearestEnemy();
    // if someone shot us, prioritize them
    if(this.alert>0&&this.alertTo&&this.alertTo.alive){e=this.alertTo;d=dist2d(this.x,this.z,e.x,e.z);}
    const lowHP=this.hp+this.shield<35;

    if(e&&(d<85||this.alert>0)) this.state= lowHP&&this.stateT<=0 ? "cover" : "attack";
    else if(this.state==="attack"||this.state==="cover"){this.state="roam";this.wp=null;}

    if(this.state==="roam"){
      let c=null,cd=120;
      for(const ch of this.g.chests){if(ch.open)continue;
        const dd=dist2d(this.x,this.z,ch.x,ch.z);if(dd<cd){cd=dd;c=ch;}}
      if(c&&(this.item.key==="pickaxe"||cd<35)){this.state="loot";this.lootC=c;}
    }

    let tx=null,tz=null,speed=6.8;
    if(this.state==="roam"){
      // after the grace period, roam waypoints chase the player directly
      const hunt=this.huntT<=0&&this.g.player.alive;
      if(!this.wp||dist2d(this.x,this.z,this.wp.x,this.wp.z)<4) this.pickWaypoint(hunt?this.g.player:null);
      tx=this.wp.x;tz=this.wp.z; if(hunt)speed=8;
    }
    else if(this.state==="loot"){
      const c=this.lootC;
      if(!c||c.open)this.state="roam";
      else{tx=c.x;tz=c.z;
        if(dist2d(this.x,this.z,c.x,c.z)<3)this.g.openChest(c);}
    }
    else if(this.state==="attack"&&e){
      const want=this.item.key==="shotgun"?11:this.item.key==="pickaxe"?2.4
                :this.item.key==="sniper"?40:22;
      const ang=Math.atan2(e.x-this.x,e.z-this.z);
      this.yaw+=Math.atan2(Math.sin(ang-this.yaw),Math.cos(ang-this.yaw))*Math.min(1,dt*6);
      const strafe=Math.sin(performance.now()/650+this.shootErr*120);
      const fwd=d>want?1:d<want*0.6?-0.8:0;
      tx=this.x+Math.sin(this.yaw)*fwd*10+Math.cos(this.yaw)*strafe*8;
      tz=this.z+Math.cos(this.yaw)*fwd*10-Math.sin(this.yaw)*strafe*8;
      speed=8.8;
      if(d<70){
        const dy=(e.eyeY()-0.4)-this.eyeY();
        const pitch=Math.atan2(dy,d);
        const aimYaw=ang+(rng()-0.5)*this.shootErr*2;
        if(this.item.def.type==="melee"&&d<3.4)this.fire(aimYaw,0);
        else if(this.item.def.type==="gun")this.fire(aimYaw,pitch+(rng()-0.5)*this.shootErr);
      }
    }
    else if(this.state==="cover"){
      if(this.stateT<=-3)this.stateT=2;
      if(e){
        let tree=null,td=1e9;
        for(const o of this.g.obstacles){if(o.kind!=="tree")continue;
          const dd=dist2d(this.x,this.z,o.x,o.z);if(dd<td){td=dd;tree=o;}}
        if(tree){tx=tree.x-(e.x-tree.x)*0.2;tz=tree.z-(e.z-tree.z)*0.2;}
        else{tx=this.x-(e.x-this.x);tz=this.z-(e.z-this.z);}
        speed=9.5;
      }
    }
    if(tx!==null){
      const dx=tx-this.x,dz=tz-this.z,l=Math.hypot(dx,dz);
      if(l>0.5){
        if(this.state!=="attack"){
          const ang=Math.atan2(dx,dz);
          this.yaw+=Math.atan2(Math.sin(ang-this.yaw),Math.cos(ang-this.yaw))*Math.min(1,dt*5);
        }
        this.move(dx/l*speed*dt,dz/l*speed*dt,dt);
      }else this.move(0,0,dt);
    }else this.move(0,0,dt);

    // pick up better weapons / heals
    for(let i=this.g.pickups.length-1;i>=0;i--){
      const p=this.g.pickups[i];
      if(dist2d(this.x,this.z,p.x,p.z)<2.4){
        if(p.item.def.type==="gun"&&itemDPS(p.item)>itemDPS(this.item)){
          this.item=p.item;this.g.pickups.splice(i,1);
        }else if(p.item.def.type==="heal"&&(this.shield<50||this.hp<60)){
          if(p.item.def.shield)this.shield=Math.min(100,this.shield+p.item.def.shield);
          if(p.item.def.hp)this.hp=Math.min(100,Math.max(this.hp,p.item.def.hp));
          this.g.pickups.splice(i,1);
        }
      }
    }
  }
}

// ---------------------------------------------------------------------
// Game
// ---------------------------------------------------------------------
const BOT_SKINS=["#f0c49a","#d9a06b","#8a5a3a","#f5d3b3","#c98b5e","#7a4a2e","#e8b88a"];
const BOT_DEFS=[
  ["Maverick","#ff5d5d","#5a2a2a"],["Razor","#7ef07a","#2e5a2e"],
  ["Blitz","#ffd23f","#6b5a1a"],["Nova","#c05df5","#4a2a6b"],
  ["Tank","#ff9a2e","#6b452a"],["Ghost","#d9e2ec","#5a6470"],
  ["Viper","#3ad0c0","#1a5a54"],
];
class Game{
  constructor(){
    seed=(Math.random()*1e9)|0;
    genTerrain();
    this.buildings=[];this.obstacles=[];this.chests=[];
    this.pickups=[];this.projectiles=[];this.dmgNums=[];this.feed=[];this.toasts=[];
    this.particles=new Particles();this.over=false;this.won=false;this.time=0;

    const spots=[[36,20,0],[-64,18,0],[120,-20,2],[-20,-88,1],[20,140,3],[-110,-30,1]];
    for(const[x,z,door]of spots)
      if(heightAt(x,z)>WATER_Y+0.5)this.buildings.push(new Building(x,z,door));

    // trees, bushes, rocks
    let trees=0;
    for(let t=0;t<700&&trees<190;t++){
      const x=(rng()*2-1)*330,z=(rng()*2-1)*330,h=heightAt(x,z);
      if(h<WATER_Y+1.2)continue;
      if(Math.abs(x)<9||Math.abs(z)<9)continue;
      if(this.buildings.some(b=>Math.abs(x-b.cx)<12&&Math.abs(z-b.cz)<12))continue;
      this.obstacles.push({kind:"tree",x,z,y:h,r:0.7,s:0.8+rng()*0.8,hue:rng()});trees++;
    }
    for(let t=0;t<120;t++){
      const x=(rng()*2-1)*330,z=(rng()*2-1)*330,h=heightAt(x,z);
      if(h<WATER_Y+1||Math.abs(x)<8||Math.abs(z)<8)continue;
      this.obstacles.push({kind:"bush",x,z,y:h,r:0,s:0.5+rng()*0.5});
    }
    for(let t=0;t<55;t++){
      const x=(rng()*2-1)*330,z=(rng()*2-1)*330,h=heightAt(x,z);
      if(h<WATER_Y+0.8||Math.abs(x)<8||Math.abs(z)<8)continue;
      this.obstacles.push({kind:"rock",x,z,y:h,r:1.0,s:0.7+rng()*0.9,rot:rng()*TAU});
    }
    // chests: in every building + scattered + two guaranteed near spawn
    for(const b of this.buildings)this.chests.push(new Chest(b.cx+2.5,b.cz+2.5));
    this.chests.push(new Chest(-22,-14));
    this.chests.push(new Chest(-14,-30));
    for(let t=0;t<120&&this.chests.length<22;t++){
      const x=(rng()*2-1)*280,z=(rng()*2-1)*280;
      if(heightAt(x,z)<WATER_Y+0.8)continue;
      if(this.chests.some(c=>dist2d(c.x,c.z,x,z)<20))continue;
      this.chests.push(new Chest(x,z));
    }
    // actors: player + 7 bots — always spawned on dry land
    const findLand=(x,z)=>{
      for(let r=0;r<200;r+=6)for(let a=0;a<TAU;a+=0.8){
        const nx=clamp(x+Math.sin(a)*r,-320,320),nz=clamp(z+Math.cos(a)*r,-320,320);
        if(heightAt(nx,nz)>WATER_Y+1)return[nx,nz];
      }
      return[0,0];
    };
    const[psx,psz]=findLand(-30,-30);
    this.player=new Player(this,psx,psz);
    // guaranteed spawn chests follow the player
    this.chests.push(new Chest(psx+8,psz+4));
    this.bots=[];
    const angles=[0,0.9,1.8,2.7,3.6,4.5,5.4];
    BOT_DEFS.forEach((bd,i)=>{
      const[bx,bz]=findLand(Math.sin(angles[i])*(120+rng()*100),Math.cos(angles[i])*(120+rng()*100));
      this.bots.push(new Bot(this,bx,bz,"Bot "+bd[0],bd[1],bd[2],BOT_SKINS[i%BOT_SKINS.length]));
    });
    this.actors=[this.player,...this.bots];
  }
  toast(txt){ this.toasts.push({txt,t:2.4}); }
  openChest(c){
    c.open=true;
    this.particles.burst(c.x,c.y+1,c.z,"#ffd23f",26,6);
    this.pickups.push(new Pickup(c.x+(rng()-0.5)*1.6,c.z+(rng()-0.5)*1.6,rollLoot()));
    if(rng()<0.4)this.pickups.push(new Pickup(c.x+(rng()-0.5)*2.2,c.z+(rng()-0.5)*2.2,rollLoot()));
  }
  checkEnd(){
    if(!this.player.alive){this.over=true;this.won=false;showEnd(false);return;}
    if(this.bots.every(b=>!b.alive)){this.over=true;this.won=true;showEnd(true);}
  }
  update(dt,input){
    if(this.over)return;
    this.time+=dt;
    this.player.update(dt,input);
    for(const b of this.bots)b.update(dt);
    this.particles.update(dt);
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p=this.projectiles[i];p.life-=dt;
      const steps=2,sdt=dt/steps;let dead=p.life<=0;
      for(let s=0;s<steps&&!dead;s++){
        p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.z+=p.vz*sdt;
        if(p.y<heightAt(p.x,p.z)||p.y<WATER_Y){this.particles.burst(p.x,p.y,p.z,"#c9b08a",4,3);dead=true;break;}
        for(const a of this.actors){
          if(a===p.owner||!a.alive)continue;
          const dx=p.x-a.x,dy=p.y-(a.y+1.1),dz=p.z-a.z;
          if(dx*dx+dz*dz<1.0&&Math.abs(dy)<1.45){
            a.takeDamage(p.dmg,p.owner);
            this.dmgNums.push({x:a.x,y:a.y+2.2,z:a.z,txt:p.dmg,t:0.9,
              col:a.shield>0?"#7ecbff":"#fff"});
            this.particles.burst(p.x,p.y,p.z,"#ff8080",6,4);
            dead=true;break;
          }
        }
        if(dead)break;
        for(const b of this.buildings){
          if(p.y>b.y+b.h)continue;
          if(Math.abs(p.x-b.cx)>b.s+1||Math.abs(p.z-b.cz)>b.s+1)continue;
          for(const w of b.walls){
            const wx=w.x2-w.x1,wz=w.z2-w.z1,len2=wx*wx+wz*wz;
            let t=((p.x-w.x1)*wx+(p.z-w.z1)*wz)/len2;t=clamp(t,0,1);
            if(dist2d(p.x,p.z,w.x1+wx*t,w.z1+wz*t)<0.3){
              this.particles.burst(p.x,p.y,p.z,"#cccccc",4,3);dead=true;break;}
          }
          if(dead)break;
        }
        if(dead)break;
        for(const o of this.obstacles){
          if(o.kind!=="tree")continue;
          if(p.y<o.y+7*o.s&&dist2d(p.x,p.z,o.x,o.z)<0.6){
            this.particles.burst(p.x,p.y,p.z,"#4f7a3a",4,3);dead=true;break;}
        }
      }
      if(dead)this.projectiles.splice(i,1);
    }
    for(let i=this.dmgNums.length-1;i>=0;i--){const d=this.dmgNums[i];
      d.t-=dt;d.y+=dt*1.6;if(d.t<=0)this.dmgNums.splice(i,1);}
    for(let i=this.feed.length-1;i>=0;i--){this.feed[i].t-=dt;if(this.feed[i].t<=0)this.feed.splice(i,1);}
    for(let i=this.toasts.length-1;i>=0;i--){this.toasts[i].t-=dt;if(this.toasts[i].t<=0)this.toasts.splice(i,1);}
    for(const c of this.chests)if(c.open&&c.anim<1)c.anim=Math.min(1,c.anim+dt*3);
    for(const p of this.pickups)p.t+=dt;
  }

  // -------------------------------------------------------------------
  // RENDER — third-person over-the-shoulder camera
  // -------------------------------------------------------------------
  render(){
    const P=this.player;
    const cy=Math.cos(P.yaw),sy=Math.sin(P.yaw);
    const cp=Math.cos(P.pitch),sp=Math.sin(P.pitch);
    // camera anchored behind + above + slightly right of the player
    const fwdX=sy*cp, fwdY=sp, fwdZ=cy*cp;
    const tgtX=P.x, tgtY=P.y+1.7, tgtZ=P.z;
    const CD=5.6;
    let ex=tgtX-fwdX*CD+cy*0.9, ey=tgtY-fwdY*CD+0.45, ez=tgtZ-fwdZ*CD-sy*0.9;
    ey=Math.max(ey,heightAt(ex,ez)+0.5,WATER_Y+0.5);
    const f=(H/2)/Math.tan(0.58);
    const polys=[];
    const SKY_HOR="#dcecf7";

    const toCam=(x,y,z)=>{
      const dx=x-ex,dy=y-ey,dz=z-ez;
      const x1=dx*cy-dz*sy,z1=dx*sy+dz*cy;
      const y2=dy*cp-z1*sp,z2=dy*sp+z1*cp;
      return [x1,y2,z2];
    };
    const addPoly=(pts,color,light)=>{
      let cpts=pts.map(p=>toCam(p[0],p[1],p[2]));
      const NEAR=0.18,out=[];
      for(let i=0;i<cpts.length;i++){
        const a=cpts[i],b=cpts[(i+1)%cpts.length];
        const ain=a[2]>NEAR,bin=b[2]>NEAR;
        if(ain)out.push(a);
        if(ain!==bin){const t=(NEAR-a[2])/(b[2]-a[2]);
          out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]);}
      }
      if(out.length<3)return;
      let depth=0;for(const p of out)depth+=p[2];depth/=out.length;
      if(depth>VIEW_DIST+50)return;
      let col=color;
      if(light!==false){
        const ux=pts[1][0]-pts[0][0],uy=pts[1][1]-pts[0][1],uz=pts[1][2]-pts[0][2];
        const vx=pts[2][0]-pts[0][0],vy=pts[2][1]-pts[0][1],vz=pts[2][2]-pts[0][2];
        let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
        const nl=Math.hypot(nx,ny,nz)||1;
        const lum=0.66+0.34*Math.abs((nx*0.35+ny*0.85+nz*0.4)/nl);
        col=shade(color,lum);
      }
      const fog=clamp((depth-100)/(VIEW_DIST-60),0,1)*0.6;
      if(fog>0.02)col=mix(col,SKY_HOR,fog);
      polys.push({pts:out,depth,col});
    };

    // sky
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#4aa3e8");grad.addColorStop(0.55,SKY_HOR);grad.addColorStop(1,"#cfe3d4");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    // sun + screen-space clouds with yaw/pitch parallax
    const horizon=H/2+Math.tan(P.pitch)*f*0.6;
    const sunA=0.8;
    let sunX=W/2+wrapAngle(sunA-P.yaw)*f*0.7, sunY=horizon-f*0.42;
    ctx.fillStyle="rgba(255,246,205,.95)";
    ctx.beginPath();ctx.arc(sunX,sunY,40,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";
    for(let i=0;i<7;i++){
      const a=i*0.9+0.3,hgt=0.22+((i*37)%5)*0.05;
      const cx=W/2+wrapAngle(a-P.yaw)*f*0.7,cyy=horizon-f*hgt;
      if(cx<-200||cx>W+200)continue;
      ctx.beginPath();
      ctx.ellipse(cx,cyy,90+i*8,22,0,0,TAU);
      ctx.ellipse(cx-50,cyy+8,55,16,0,0,TAU);
      ctx.ellipse(cx+55,cyy+10,60,17,0,0,TAU);
      ctx.fill();
    }

    // terrain
    const ci=clamp(Math.floor((ex+HALF)/CELL),0,N-1),cj=clamp(Math.floor((ez+HALF)/CELL),0,N-1);
    const RC=Math.ceil(VIEW_DIST/CELL);
    for(let j=Math.max(0,cj-RC);j<Math.min(N,cj+RC);j++){
      for(let i=Math.max(0,ci-RC);i<Math.min(N,ci+RC);i++){
        const x0=i*CELL-HALF,z0=j*CELL-HALF;
        const mx=x0+CELL/2,mz=z0+CELL/2;
        const ddx=mx-ex,ddz=mz-ez,dd=Math.hypot(ddx,ddz);
        if(dd>VIEW_DIST)continue;
        if(dd>24&&(ddx*fwdX+ddz*fwdZ)/dd<0.1)continue;
        const a=heights[hIndex(i,j)],b=heights[hIndex(i+1,j)],
              c2=heights[hIndex(i+1,j+1)],d2=heights[hIndex(i,j+1)];
        const avg=(a+b+c2+d2)/4;
        if(avg<WATER_Y-0.2){
          addPoly([[x0,WATER_Y,z0],[x0+CELL,WATER_Y,z0],[x0+CELL,WATER_Y,z0+CELL],[x0,WATER_Y,z0+CELL]],
            ((i+j)&1)?"#3f9fd9":"#46a8e2",false);
          continue;
        }
        let col;
        if(cellRoad[j*N+i])col=((i+j)&1)?"#8e8e94":"#94949a";
        else if(avg<WATER_Y+0.9)col="#e3d394";
        else{
          const v=hash2(i*3+11,j*3+7);
          col=v<0.33?"#5da23e":v<0.66?"#67ac46":"#72b54e";
          if(avg>16)col=mix(col,"#9aa68a",clamp((avg-16)/10,0,0.6)); // rocky tops
        }
        addPoly([[x0,a,z0],[x0+CELL,b,z0],[x0+CELL,c2,z0+CELL],[x0,d2,z0+CELL]],col);
      }
    }

    // box / pyramid helpers
    const addBox=(bx,by,bz,sx,syy,sz,col,yaw)=>{
      const c=Math.cos(yaw||0),s=Math.sin(yaw||0);
      const Pt=(lx,ly,lz)=>[bx+lx*c+lz*s,by+ly,bz-lx*s+lz*c];
      const v=[Pt(-sx,0,-sz),Pt(sx,0,-sz),Pt(sx,0,sz),Pt(-sx,0,sz),
               Pt(-sx,syy,-sz),Pt(sx,syy,-sz),Pt(sx,syy,sz),Pt(-sx,syy,sz)];
      addPoly([v[0],v[1],v[5],v[4]],col);addPoly([v[1],v[2],v[6],v[5]],col);
      addPoly([v[2],v[3],v[7],v[6]],col);addPoly([v[3],v[0],v[4],v[7]],col);
      addPoly([v[4],v[5],v[6],v[7]],col);
    };
    const addPyramid=(px,py,pz,s,h,col)=>{
      const apex=[px,py+h,pz];
      const b=[[px-s,py,pz-s],[px+s,py,pz-s],[px+s,py,pz+s],[px-s,py,pz+s]];
      for(let i=0;i<4;i++)addPoly([b[i],b[(i+1)%4],apex],col);
    };

    // vegetation & rocks
    for(const o of this.obstacles){
      const d=dist2d(o.x,o.z,ex,ez);if(d>VIEW_DIST*0.95)continue;
      if(o.kind==="tree"){
        addBox(o.x,o.y,o.z,0.32*o.s,2.4*o.s,0.32*o.s,"#7a5230");
        const leaf=o.hue<0.4?"#2f8a3c":o.hue<0.75?"#3aa047":"#52b052";
        addPyramid(o.x,o.y+1.7*o.s,o.z,2.4*o.s,2.8*o.s,leaf);
        addPyramid(o.x,o.y+3.4*o.s,o.z,1.7*o.s,2.4*o.s,shade(leaf,1.12));
        addPyramid(o.x,o.y+4.9*o.s,o.z,1.0*o.s,1.8*o.s,shade(leaf,1.22));
      }else if(o.kind==="bush"){
        if(d>130)continue;
        addPyramid(o.x,o.y,o.z,1.1*o.s,1.0*o.s,"#4f9a3e");
        addPyramid(o.x+0.6*o.s,o.y,o.z+0.3*o.s,0.8*o.s,0.8*o.s,"#5aa648");
      }else{
        addBox(o.x,o.y,o.z,1.1*o.s,0.9*o.s,0.9*o.s,"#9aa0a6",o.rot);
        addBox(o.x+0.5*o.s,o.y,o.z-0.4*o.s,0.6*o.s,0.5*o.s,0.6*o.s,"#a7adb3",o.rot+0.6);
      }
    }

    // buildings with windows + parapet roof
    const bcols=["#e9b86f","#d96f5a","#7fa8d9","#cfc6b4","#a3c98a","#caa3d9"];
    for(const b of this.buildings){
      const d=dist2d(b.cx,b.cz,ex,ez);if(d>VIEW_DIST)continue;
      const wc=bcols[this.buildings.indexOf(b)%bcols.length];
      addPoly([[b.cx-b.s,b.y+0.04,b.cz-b.s],[b.cx+b.s,b.y+0.04,b.cz-b.s],
               [b.cx+b.s,b.y+0.04,b.cz+b.s],[b.cx-b.s,b.y+0.04,b.cz+b.s]],"#b9a98c");
      for(const w of b.walls){
        addPoly([[w.x1,b.y,w.z1],[w.x2,b.y,w.z2],[w.x2,b.y+b.h,w.z2],[w.x1,b.y+b.h,w.z1]],wc);
        // window panes (decorative quads slightly offset outward)
        if(w.win&&d<160){
          const wx=w.x2-w.x1,wz=w.z2-w.z1,len=Math.hypot(wx,wz);
          const nxN=wz/len,nzN=-wx/len;            // wall normal
          for(const side of [-1,1]){
            for(const t of [0.3,0.7]){
              const cxw=w.x1+wx*t+nxN*0.06*side, czw=w.z1+wz*t+nzN*0.06*side;
              const hw=0.7,y0=b.y+3.6,ux=wx/len*hw,uz=wz/len*hw;
              addPoly([[cxw-ux,y0,czw-uz],[cxw+ux,y0,czw+uz],
                       [cxw+ux,y0+1.4,czw+uz],[cxw-ux,y0+1.4,czw-uz]],"#39506b",false);
            }
          }
        }
      }
      // roof split into quadrants so depth sorting stays clean
      for(const[qx,qz]of[[-1,-1],[1,-1],[1,1],[-1,1]]){
        const x1=b.cx, x2=b.cx+qx*(b.s+0.5), z1=b.cz, z2=b.cz+qz*(b.s+0.5);
        addPoly([[Math.min(x1,x2),b.y+b.h,Math.min(z1,z2)],[Math.max(x1,x2),b.y+b.h,Math.min(z1,z2)],
                 [Math.max(x1,x2),b.y+b.h,Math.max(z1,z2)],[Math.min(x1,x2),b.y+b.h,Math.max(z1,z2)]],"#8a4f3d");
      }
      for(const[ddx,ddz]of[[-1,-1],[1,-1],[1,1],[-1,1]])
        addBox(b.cx+ddx*b.s,b.y+b.h,b.cz+ddz*b.s,0.3,0.6,0.3,shade(wc,0.8));
    }

    // chests + glow beacons so they're easy to spot
    for(const c of this.chests){
      const d=dist2d(c.x,c.z,ex,ez);if(d>VIEW_DIST)continue;
      if(!c.open&&d<200){
        const bh=5+Math.sin(this.time*2+c.x)*0.4;
        addPoly([[c.x-0.25,c.y+1.2,c.z],[c.x+0.25,c.y+1.2,c.z],
                 [c.x+0.12,c.y+bh,c.z],[c.x-0.12,c.y+bh,c.z]],"rgba(255,210,63,0.5)",false);
      }
      if(d>170)continue;
      addBox(c.x,c.y,c.z,0.85,0.65,0.6,c.open?"#8f7335":"#c8902f");
      addBox(c.x,c.y+0.65+(c.anim*0.55),c.z-c.anim*0.45,0.9,0.3,0.65,c.open?"#7a6230":"#a87b28");
      addBox(c.x,c.y+0.25,c.z+0.61,0.14,0.22,0.05,"#ffe27a");          // latch
      addBox(c.x,c.y+0.02,c.z,0.92,0.08,0.66,"#6e5524");               // base trim
    }

    // pickups
    for(const p of this.pickups){
      const d=dist2d(p.x,p.z,ex,ez);if(d>140)continue;
      const col=p.item.def.type==="heal"?"#3ad0c0":RARITY[p.item.rarity].col;
      addBox(p.x,p.y+Math.sin(p.t*3)*0.15,p.z,0.35,0.7,0.35,col,p.t*1.5);
    }

    // humanoid characters (player included — third person)
    const nameTags=[];
    for(const a of this.actors){
      if(!a.alive)continue;
      const d=dist2d(a.x,a.z,ex,ez);if(d>VIEW_DIST)continue;
      this.drawHumanoid(a,addBox,addPoly);
      if(a!==P&&d<120)nameTags.push(a);
    }

    // projectiles (tracer triangles)
    for(const p of this.projectiles)
      addPoly([[p.x-0.09,p.y,p.z],[p.x+0.09,p.y,p.z],[p.x,p.y+0.18,p.z]],p.col,false);
    // particles
    for(const p of this.particles.list){
      const s=p.size;
      addPoly([[p.x-s,p.y,p.z],[p.x+s,p.y,p.z],[p.x,p.y+s*2,p.z]],p.col,false);
    }

    // sort + rasterize
    polys.sort((a,b)=>b.depth-a.depth);
    for(const Q of polys){
      ctx.fillStyle=Q.col;ctx.beginPath();
      let p=Q.pts[0],sc=f/p[2];
      ctx.moveTo(W/2+p[0]*sc,H/2-p[1]*sc);
      for(let i=1;i<Q.pts.length;i++){p=Q.pts[i];sc=f/p[2];
        ctx.lineTo(W/2+p[0]*sc,H/2-p[1]*sc);}
      ctx.closePath();ctx.fill();
    }

    // bot name tags
    ctx.textAlign="center";ctx.font="bold 13px Arial";
    for(const a of nameTags){
      const p=toCam(a.x,a.y+2.45,a.z);if(p[2]<0.2)continue;
      const sc=f/p[2];
      ctx.fillStyle="rgba(0,0,0,.45)";
      const sxp=W/2+p[0]*sc,syp=H/2-p[1]*sc;
      ctx.fillRect(sxp-34,syp-13,68,17);
      ctx.fillStyle="#fff";ctx.fillText(a.name,sxp,syp);
    }
    // damage numbers
    ctx.font="bold 20px Arial";
    for(const dn of this.dmgNums){
      const p=toCam(dn.x,dn.y,dn.z);if(p[2]<0.2)continue;
      const sc=f/p[2];
      ctx.globalAlpha=clamp(dn.t/0.9,0,1);
      ctx.fillStyle=dn.col;
      ctx.fillText(dn.txt,W/2+p[0]*sc,H/2-p[1]*sc);
    }
    ctx.globalAlpha=1;
    this.renderHUD();
  }

  // low-poly humanoid: legs, torso, arms, head + held item
  drawHumanoid(a,addBox,addPoly){
    const t=a.walk||0;
    const legSwing=a.moving?Math.sin(t)*0.45:0;
    const armSwing=a.moving?Math.sin(t)*0.5:0;
    const yaw=a.yaw,c=Math.cos(yaw),s=Math.sin(yaw);
    const off=(lx,lz)=>[a.x+lx*c+lz*s, a.z-lx*s+lz*c];
    // legs (swing fore/aft)
    let [lx1,lz1]=off(-0.16, legSwing*0.5);
    let [lx2,lz2]=off( 0.16,-legSwing*0.5);
    addBox(lx1,a.y,lz1,0.13,0.85,0.15,a.pants,yaw);
    addBox(lx2,a.y,lz2,0.13,0.85,0.15,a.pants,yaw);
    // torso
    addBox(a.x,a.y+0.85,a.z,0.42,0.75,0.24,a.shirt,yaw);
    // arms — right arm raises while attacking
    const raise=a.swing>0?1.2:0;
    let [ax1,az1]=off(-0.54,-armSwing*0.4);
    addBox(ax1,a.y+0.85,az1,0.11,0.7,0.13,shade(a.shirt,0.85),yaw);
    let [ax2,az2]=off(0.54, armSwing*0.4+raise*0.25);
    addBox(ax2,a.y+0.85+raise*0.25,az2,0.11,0.7,0.13,shade(a.shirt,0.85),yaw);
    // head + simple face strip
    addBox(a.x,a.y+1.62,a.z,0.24,0.42,0.24,a.skin,yaw);
    const [fx,fz]=off(0,0.25);
    addBox(fx,a.y+1.78,fz,0.18,0.08,0.02,"#3a2a1e",yaw); // eyes band
    // held item in right hand
    const [hx,hz]=off(0.62,0.45);
    const hy=a.y+1.0+raise*0.4;
    const it=a.item;
    if(it.def.type==="melee"){
      // pickaxe: brown handle + steel head with two pick points
      const tilt=a.swing>0?a.swing*4:0.5;
      const hc=Math.cos(yaw),hs=Math.sin(yaw);
      const top=[hx+hs*Math.sin(tilt)*1.1,hy+Math.cos(tilt)*1.1,hz+hc*Math.sin(tilt)*1.1];
      addPoly([[hx-0.05,hy,hz],[hx+0.05,hy,hz],[top[0]+0.05,top[1],top[2]],[top[0]-0.05,top[1],top[2]]],"#7a5230");
      const px2=top[0],py2=top[1],pz2=top[2];
      addBox(px2,py2-0.08,pz2,0.55,0.14,0.08,"#aab3bd",yaw);          // head bar
      addPyramid_(addPoly,px2+hc*0.55,py2,pz2-hs*0.55,0.1,-0.35,"#c4ccd4");
      addPyramid_(addPoly,px2-hc*0.55,py2,pz2+hs*0.55,0.1,-0.35,"#c4ccd4");
    } else if(it.def.type==="heal"){
      addBox(hx,hy,hz,0.12,0.3,0.12,it.def.shield?"#3aa0ff":"#e8eef4",yaw);
    } else {
      const col=RARITY[it.rarity].col;
      const len=it.key==="sniper"?1.0:it.key==="ar"?0.8:it.key==="shotgun"?0.7:0.5;
      addBox(hx,hy-0.05,hz,0.07,0.14,0.18,"#3c4654",yaw);             // grip/receiver
      const [mx2,mz2]=[hx+Math.sin(yaw)*len*0.6,hz+Math.cos(yaw)*len*0.6];
      addBox(mx2,hy,mz2,0.06,0.1,len,col,yaw);                         // barrel
    }
  }

  renderHUD(){
    const P=this.player;
    // crosshair
    ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W/2-11,H/2);ctx.lineTo(W/2-3,H/2);
    ctx.moveTo(W/2+3,H/2);ctx.lineTo(W/2+11,H/2);
    ctx.moveTo(W/2,H/2-11);ctx.lineTo(W/2,H/2-3);
    ctx.moveTo(W/2,H/2+3);ctx.lineTo(W/2,H/2+11);
    ctx.stroke();
    // pointer-lock hint
    if(document.pointerLockElement!==canvas&&!this.over){
      ctx.fillStyle="rgba(10,16,28,.7)";ctx.fillRect(W/2-180,70,360,38);
      ctx.fillStyle="#ffd23f";ctx.font="bold 17px Arial";ctx.textAlign="center";
      ctx.fillText("Click the game to capture the mouse and look around",W/2,95);
    }
    // bars
    const bx=24,by=H-64,bw=260;
    ctx.fillStyle="rgba(10,16,28,.6)";ctx.fillRect(bx-8,by-34,bw+16,64);
    ctx.fillStyle="#26406b";ctx.fillRect(bx,by-24,bw,12);
    ctx.fillStyle="#3aa0ff";ctx.fillRect(bx,by-24,bw*P.shield/100,12);
    ctx.fillStyle="#4a2630";ctx.fillRect(bx,by,bw,16);
    ctx.fillStyle="#48d06a";ctx.fillRect(bx,by,bw*P.hp/100,16);
    ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="left";
    ctx.fillText("SHIELD "+Math.round(P.shield),bx+4,by-14);
    ctx.fillText("HP "+Math.round(P.hp),bx+4,by+13);
    // weapon / ammo
    const it=P.item;ctx.textAlign="right";
    ctx.fillStyle=RARITY[it.rarity].col;ctx.font="bold 20px Arial";
    ctx.fillText((it.def.type==="gun"?RARITY[it.rarity].name+" ":"")+it.def.label,W-26,H-58);
    ctx.fillStyle="#fff";ctx.font="bold 30px Arial";
    if(it.def.type==="gun")
      ctx.fillText(it.reloading>0?"RELOADING…":(it.ammo+" / ∞"),W-26,H-26);
    else if(it.def.type==="heal")
      ctx.fillText(it.drinking>0?"USING…":(it.def.shield?"+50 shield":"full heal"),W-26,H-26);
    // inventory
    const sw=58,total=5*sw+4*8,sx0=W/2-total/2,syy=H-70;
    for(let i=0;i<5;i++){
      const x=sx0+i*(sw+8),inv=P.inv[i];
      ctx.fillStyle=i===P.slot?"rgba(255,210,63,.25)":"rgba(10,16,28,.55)";
      ctx.fillRect(x,syy,sw,sw);
      ctx.strokeStyle=i===P.slot?"#ffd23f":"rgba(255,255,255,.25)";
      ctx.lineWidth=2;ctx.strokeRect(x,syy,sw,sw);
      ctx.fillStyle="#9fb2c4";ctx.font="bold 11px Arial";ctx.textAlign="left";
      ctx.fillText(i+1,x+5,syy+14);
      if(inv){
        ctx.fillStyle=RARITY[inv.rarity].col;ctx.textAlign="center";ctx.font="bold 12px Arial";
        ctx.fillText(inv.def.short,x+sw/2,syy+sw/2+4);
        if(inv.def.type==="gun"){ctx.fillStyle="#cfe0f5";ctx.font="10px Arial";
          ctx.fillText(inv.ammo,x+sw/2,syy+sw-6);}
      }
    }
    // alive counter + feed
    const remaining=this.actors.filter(a=>a.alive).length;
    ctx.fillStyle="rgba(10,16,28,.6)";ctx.fillRect(W-170,18,150,40);
    ctx.fillStyle="#ffd23f";ctx.font="bold 22px Arial";ctx.textAlign="right";
    ctx.fillText(remaining+" ALIVE",W-32,45);
    ctx.font="bold 14px Arial";ctx.fillStyle="#fff";
    this.feed.forEach((fo,i)=>ctx.fillText(fo.txt,W-26,84+i*22));
    // chest prompt
    if(this.chests.some(c=>!c.open&&dist2d(P.x,P.z,c.x,c.z)<3.6)){
      ctx.textAlign="center";ctx.fillStyle="#ffd23f";ctx.font="bold 22px Arial";
      ctx.fillText("[E]  Open Chest",W/2,H/2+70);
    }
    // toasts
    ctx.textAlign="center";ctx.font="bold 16px Arial";ctx.fillStyle="#cfe0f5";
    this.toasts.forEach((tt,i)=>ctx.fillText(tt.txt,W/2,H*0.2+i*24));
  }
}

// standalone pyramid (used inside drawHumanoid for pickaxe tips)
function addPyramid_(addPoly,px,py,pz,s,h,col){
  const apex=[px,py+h,pz];
  const b=[[px-s,py,pz-s],[px+s,py,pz-s],[px+s,py,pz+s],[px-s,py,pz+s]];
  for(let i=0;i<4;i++)addPoly([b[i],b[(i+1)%4],apex],col);
}
function wrapAngle(a){ while(a>Math.PI)a-=TAU; while(a<-Math.PI)a+=TAU; return a; }
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function shade(c,l){ if(c.startsWith("rgba"))return c;
  const[r,g,b]=c.startsWith("rgb")?c.match(/\d+/g).map(Number):hex(c);
  return `rgb(${clamp(r*l,0,255)|0},${clamp(g*l,0,255)|0},${clamp(b*l,0,255)|0})`;}
function mix(c1,c2,t){ if(c1.startsWith("rgba"))return c1;
  const a=c1.startsWith("rgb")?c1.match(/\d+/g).map(Number):hex(c1),b=hex(c2);
  return `rgb(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0}`+")";}

// ---------------------------------------------------------------------
// Input — pointer lock with drag fallback so looking ALWAYS works
// ---------------------------------------------------------------------
const input={keys:{},mouse:false,mx:0,my:0,pressedE:false};
let dragLook=false,lastMX=0,lastMY=0;
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  input.keys[k]=true;
  if(k==="e")input.pressedE=true;
  if(k>="1"&&k<="5"&&game)game.player.selectSlot(+k-1);
  if(k==="enter"&&game&&game.over)startGame();
});
addEventListener("keyup",e=>{input.keys[e.key.toLowerCase()]=false;});
canvas.addEventListener("mousedown",e=>{
  if(e.button===0){
    if(document.pointerLockElement!==canvas){
      canvas.requestPointerLock&&canvas.requestPointerLock();
      dragLook=true;lastMX=e.clientX;lastMY=e.clientY;   // fallback: drag to look
    } else input.mouse=true;
  }
});
addEventListener("mouseup",e=>{if(e.button===0){input.mouse=false;dragLook=false;}});
addEventListener("mousemove",e=>{
  if(document.pointerLockElement===canvas){
    input.mx+=e.movementX;input.my+=e.movementY;
  } else if(dragLook){
    input.mx+=e.clientX-lastMX;input.my+=e.clientY-lastMY;
    lastMX=e.clientX;lastMY=e.clientY;
  }
});
document.addEventListener("pointerlockchange",()=>{
  if(document.pointerLockElement===canvas)dragLook=false;
});

// ---------------------------------------------------------------------
// Flow
// ---------------------------------------------------------------------
const overlay=document.getElementById("overlay");
const panel=document.getElementById("panel");
const playBtn=document.getElementById("playBtn");
let game=null;
function startGame(){
  game=new Game();
  overlay.classList.add("hidden");
  canvas.requestPointerLock&&canvas.requestPointerLock();
}
function showEnd(won){
  document.exitPointerLock&&document.exitPointerLock();
  panel.querySelector("h1").innerHTML=won
    ?'VICTORY <span>ROYALE!</span>':'YOU WERE <span>ELIMINATED</span>';
  document.getElementById("subtitle").textContent=won
    ?"Last one standing. GG.":"Better luck next drop.";
  playBtn.textContent="PLAY AGAIN";
  overlay.classList.remove("hidden");
}
playBtn.addEventListener("click",startGame);

// ---------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(game){game.update(dt,input);game.render();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
